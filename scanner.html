<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stair Motivation - Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container scanner-page">
    <header class="app-header-minimal">
      <button class="btn back-btn" onclick="window.location.href='index.html'">
        ←
      </button>
      <p id="scanner-username" class="username-display"></p>
      <button id="lang-toggle" class="lang-toggle" data-i18n-key="btn_lang_ar">عربي</button>
    </header>

    <main class="scanner-main">
      <!-- Glowing stopwatch icon -->
      <div class="timer-icon-wrapper">
        <div class="timer-glow-circle"></div>
        <div class="timer-icon">⏱</div>
      </div>

      <!-- Time elapsed label -->
      <p class="time-label" data-i18n-key="label_time_elapsed">Time Elapsed</p>

      <!-- Large centered timer -->
      <div id="timer-display" class="timer-display-large">00:00.00</div>

      <!-- Status message -->
      <p id="scanner-status" class="scanner-status-text"></p>

      <!-- Hidden QR reader (only visible when scanning) -->
      <div id="qr-reader" class="qr-reader-hidden"></div>

      <!-- Large scan button -->
      <button id="btn-scan" class="btn-scan-large">
        ↑ <span data-i18n-key="btn_scan_qr">Scan Floor QR Code</span>
      </button>

      <!-- Action buttons -->
      <div class="scanner-actions">
        <button id="btn-restart" class="btn-text" data-i18n-key="btn_restart_session">
          ✕ Restart Session
        </button>
        <button id="btn-change-player" class="btn-text">
          👤 Change Player
        </button>
      </div>
    </main>

    <!-- Saving overlay shown while syncing data -->
    <div id="saving-overlay" class="saving-overlay">
      <div class="saving-card">
        <div class="saving-spinner"></div>
        <p class="saving-text">Saving your climb...</p>
      </div>
    </div>
  </div>

  <!-- External libraries (replace with local copies for full offline use) -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <script src="js/i18n.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/scanner.js"></script>
  <script>
    document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>

</html>
