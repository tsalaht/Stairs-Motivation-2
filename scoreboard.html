<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stair Motivation - Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <button class="btn back-btn" onclick="window.location.href='index.html'">
        ←
      </button>
      <h1 data-i18n-key="scoreboard_title">Scoreboard</h1>
      <button id="lang-toggle" class="lang-toggle" data-i18n-key="btn_lang_ar">عربي</button>
    </header>

    <main class="card">
      <section class="scoreboard-controls">
        <div class="result-header-row">
          <div class="result-header-left">
            <div class="game-badge">📊 Hall of Stairs</div>
            <h2 class="game-title" data-i18n-key="scoreboard_subtitle">Top Climbers</h2>
          </div>
        </div>
        <div class="btn-group">
          <button id="sort-time" class="btn primary-btn" data-i18n-key="btn_sort_time">
            ⏱ Sort by Lowest Time
          </button>
          <button id="sort-steps" class="btn secondary-btn" data-i18n-key="btn_sort_steps">
            🦵 Sort by Most Steps
          </button>
        </div>
      </section>

      <section class="scoreboard-table-wrapper">
        <p id="scoreboard-loading" class="loading-message">Loading leaderboard...</p>
        <table class="scoreboard-table">
          <thead>
            <tr>
              <th data-i18n-key="th_rank">#</th>
              <th data-i18n-key="th_name">Name</th>
              <th data-i18n-key="th_floors">Total Floors</th>
              <th data-i18n-key="th_steps">Total Steps</th>
              <th data-i18n-key="th_time">Best Time</th>
              <th data-i18n-key="th_date">Last Played</th>
            </tr>
          </thead>
          <tbody id="scoreboard-body">
            <!-- Rows will be injected here -->
          </tbody>
        </table>
        <p id="scoreboard-empty" class="empty-message" data-i18n-key="scoreboard_empty">
          No climbs yet. Be the first to take the stairs!
        </p>
      </section>
    </main>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/scoreboard.js"></script>
  <script>
    document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>

</html>
