<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stair Motivation - Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container result-page">
    <header class="app-header-minimal">
      <button class="btn back-btn" onclick="window.location.href='scanner.html'">
        ←
      </button>
      <p id="res-username" class="username-display"></p>
      <button id="lang-toggle" class="lang-toggle" data-i18n-key="btn_lang_ar">عربي</button>
    </header>

    <main class="result-main">
      <!-- Stats Grid: 2x2 cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">⏱</div>
          <p class="stat-label" data-i18n-key="label_time_spent">Time</p>
          <p id="res-time" class="stat-value">00:00.00</p>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🪜</div>
          <p class="stat-label" data-i18n-key="label_steps_climbed">Steps</p>
          <p id="res-steps" class="stat-value">0</p>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📍</div>
          <p class="stat-label" data-i18n-key="label_floors_climbed">Floors</p>
          <p id="res-floors" class="stat-value">0</p>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <p class="stat-label" data-i18n-key="label_avg_per_floor">Avg/Floor</p>
          <p id="res-avg" class="stat-value">—</p>
        </div>
      </div>

      <!-- Large Rank Card -->
      <div class="rank-card-large">
        <div class="rank-icon-wrapper">
          <div class="rank-icon" id="res-medal">🏆</div>
        </div>
        <p class="rank-label" data-i18n-key="label_your_rank">Your Rank</p>
        <p id="res-rank-number" class="rank-value">#1</p>
        <p id="res-rank-details" class="rank-details">Total: 0 steps</p>
      </div>

      <!-- Direction text (hidden initially) -->
      <p id="res-direction" class="direction-text"></p>

      <!-- Action Buttons -->
      <button class="btn-action-large" onclick="window.location.href='index.html'">
        🏠 <span data-i18n-key="btn_back_home">Back to Home</span>
      </button>

      <div class="result-actions">
        <button class="btn-text-action" id="btn-continue">
          ▶ <span data-i18n-key="btn_continue_climbing">Continue Climbing</span>
        </button>
        <button class="btn-text-action" onclick="window.location.href='scoreboard.html'">
          📊 <span data-i18n-key="btn_view_scoreboard">View Scoreboard</span>
        </button>
      </div>

      <!-- Scoreboard Section -->
      <div class="result-scoreboard-section">
        <div class="scoreboard-header">
          <h3 class="scoreboard-title">📊 <span data-i18n-key="scoreboard_title">Leaderboard</span></h3>
          <div class="scoreboard-sort-tabs">
            <button id="sort-time-result" class="sort-tab active" data-i18n-key="btn_sort_time_short">⏱ Time</button>
            <button id="sort-steps-result" class="sort-tab" data-i18n-key="btn_sort_steps_short">🦵 Steps</button>
          </div>
        </div>
        <div class="scoreboard-table-compact">
          <table class="scoreboard-table-mini">
            <thead>
              <tr>
                <th>#</th>
                <th data-i18n-key="th_name">Name</th>
                <th data-i18n-key="th_steps">Steps</th>
                <th data-i18n-key="th_time">Time</th>
              </tr>
            </thead>
            <tbody id="scoreboard-body-result">
              <!-- Rows injected here -->
            </tbody>
          </table>
          <p id="scoreboard-empty-result" class="empty-message" data-i18n-key="scoreboard_empty">
            No climbs yet. Be the first!
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    function formatDuration(seconds) {
      const s = Math.floor(seconds);
      const cs = Math.floor((seconds - s) * 100);
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
    }

    // Scoreboard functions
    let userScoresData = [];
    let currentUserName = '';

    function loadScoreboard() {
      const appState = JSON.parse(localStorage.getItem('stairApp') || '{}');
      const scoresObj = appState.userScores || {};
      userScoresData = Object.values(scoresObj);
      currentUserName = appState.userName || '';
    }

    function renderScoreboard() {
      const tbody = document.getElementById('scoreboard-body-result');
      const emptyMsg = document.getElementById('scoreboard-empty-result');

      tbody.innerHTML = '';

      if (!userScoresData.length) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      // Show top 5 only
      const topUsers = userScoresData.slice(0, 5);

      topUsers.forEach((user, index) => {
        const tr = document.createElement('tr');
        
        // Highlight current user
        if (user.name === currentUserName) {
          tr.classList.add('current-user');
        }

        const rankTd = document.createElement('td');
        if (index === 0) rankTd.innerHTML = '🥇';
        else if (index === 1) rankTd.innerHTML = '🥈';
        else if (index === 2) rankTd.innerHTML = '🥉';
        else rankTd.textContent = index + 1;

        const nameTd = document.createElement('td');
        nameTd.textContent = user.name || '-';

        const stepsTd = document.createElement('td');
        stepsTd.textContent = user.totalSteps || 0;

        const timeTd = document.createElement('td');
        timeTd.textContent = formatDuration(user.bestTime || 0);

        tr.appendChild(rankTd);
        tr.appendChild(nameTd);
        tr.appendChild(stepsTd);
        tr.appendChild(timeTd);

        tbody.appendChild(tr);
      });
    }

    function sortByTime() {
      userScoresData.sort((a, b) => (a.bestTime || 0) - (b.bestTime || 0));
      renderScoreboard();
      document.getElementById('sort-time-result').classList.add('active');
      document.getElementById('sort-steps-result').classList.remove('active');
    }

    function sortBySteps() {
      userScoresData.sort((a, b) => (b.totalSteps || 0) - (a.totalSteps || 0));
      renderScoreboard();
      document.getElementById('sort-steps-result').classList.add('active');
      document.getElementById('sort-time-result').classList.remove('active');
    }

    function loadResult() {
      const appState = JSON.parse(localStorage.getItem('stairApp') || '{}');
      const session = appState.lastSession;
      if (!session) {
        window.location.href = 'scanner.html';
        return;
      }

      // Username display
      const usernameEl = document.getElementById('res-username');
      if (usernameEl) {
        usernameEl.textContent = session.name || 'Player';
      }

      // Stat cards
      document.getElementById('res-time').textContent = formatDuration(session.durationSec);
      document.getElementById('res-steps').textContent = session.steps;
      document.getElementById('res-floors').textContent = session.floors;
      document.getElementById('res-avg').textContent =
        session.floors > 0 ? formatDuration(session.avgPerFloorSec) : '—';

      // Direction text (up or down) with simple icon
      const dirEl = document.getElementById('res-direction');
      if (session.direction === 'down') {
        dirEl.textContent = `⬇ ${session.steps} steps DOWN – nice control!`;
      } else {
        dirEl.textContent = `⬆ ${session.steps} steps UP – great climb!`;
      }

      // Rank card
      const rankNumberEl = document.getElementById('res-rank-number');
      const rankDetailsEl = document.getElementById('res-rank-details');
      const medalEl = document.getElementById('res-medal');
      const userScores = appState.userScores || {};
      const userName = session.name;
      
      if (userScores[userName]) {
        const userStats = userScores[userName];
        // Calculate rank by total steps
        const allUsers = Object.values(userScores);
        const sortedBySteps = [...allUsers].sort((a, b) => b.totalSteps - a.totalSteps);
        const userIndex = sortedBySteps.findIndex((u) => u.name === userName);
        const rank = userIndex >= 0 ? userIndex + 1 : null;
        
        if (rank) {
          rankNumberEl.textContent = `#${rank}`;
          rankDetailsEl.textContent = `Total: ${userStats.totalSteps} steps across ${userStats.sessionCount} session${userStats.sessionCount > 1 ? 's' : ''}`;
          
          if (rank === 1) {
            medalEl.textContent = '🥇';
          } else if (rank === 2) {
            medalEl.textContent = '🥈';
          } else if (rank === 3) {
            medalEl.textContent = '🥉';
          } else {
            medalEl.textContent = '🏆';
          }
        } else {
          rankNumberEl.textContent = '#?';
          rankDetailsEl.textContent = `Total: ${userStats.totalSteps} steps`;
          medalEl.textContent = '🎮';
        }
      } else {
        rankNumberEl.textContent = '#1';
        rankDetailsEl.textContent = `Total: ${session.steps} steps`;
        medalEl.textContent = '🏆';
      }
    }

    document.getElementById('btn-continue').addEventListener('click', function () {
      // Set current floor to last end floor and go to scanner
      const appState = JSON.parse(localStorage.getItem('stairApp') || '{}');
      const session = appState.lastSession;
      if (session) {
        appState.currentFloor = session.endFloor;
        localStorage.setItem('stairApp', JSON.stringify(appState));
      }
      window.location.href = 'scanner.html';
    });

    document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);

    // Sort buttons for scoreboard
    document.getElementById('sort-time-result').addEventListener('click', sortByTime);
    document.getElementById('sort-steps-result').addEventListener('click', sortBySteps);

    (function init() {
      const appState = JSON.parse(localStorage.getItem('stairApp') || '{}');
      const lang = appState.lang || 'en';
      setLanguage(lang);
      loadResult();
      loadScoreboard();
      sortBySteps(); // Default sort by steps
    })();
  </script>
</body>
</html>
